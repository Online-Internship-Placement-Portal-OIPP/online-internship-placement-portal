
# S0-04: Pull Request automation.
#
# SECURITY:
# This workflow uses pull_request_target, so it must NEVER
# check out or execute code supplied by a Pull Request.

name: PR Automation

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  assign-author:
    name: Assign PR Author
    runs-on: ubuntu-latest

    steps:
      - name: Assign the author if no assignee exists
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            if (pr.assignees.length === 0) {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [pr.user.login]
              });
            }

  label:
    name: Label PR
    runs-on: ubuntu-latest

    steps:
      - name: Apply labels based on changed files
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

  title-check:
    name: Check PR Title
    runs-on: ubuntu-latest

    steps:
      - name: Validate story ID in PR title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;

            const pattern = /^\[S[0-2]-\d{2}\] .+/;

            if (!pattern.test(title)) {
              core.setFailed(
                'Invalid PR title. Use [S0-04] Description ' +
                'or [S1-05] Description.'
              );
            } else {
              core.info(`Valid PR title: ${title}`);
            }
